{{ define "main" }}
<div class="post-layout">
  <article class="post-content-col">
    <header class="post-header">
      <h1>{{ .Title }}</h1>
      <div class="post-meta">
        <time datetime="{{ .Date.Format "2006-01-02" }}">{{ time.Format ":date_long" .Date }}</time>
        <button type="button" class="icon-btn" id="post-share-btn" title="Share" aria-label="Share">
          <i class="fa-solid fa-share-nodes" aria-hidden="true"></i>
        </button>
      </div>
    </header>

    {{ partial "toc.html" . }}

    <div class="post-body">
      {{ .Content }}
    </div>
  </article>

  {{ partial "related-posts.html" . }}
</div>
{{ end }}
