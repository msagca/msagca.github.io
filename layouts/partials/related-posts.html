{{- $page := . -}}
{{- $related := where (site.RegularPages.Related $page) "Type" "post" -}}
{{- $related = first 5 $related -}}
{{- if $related }}
<nav class="post-rail post-related-rail" aria-label="Related posts">
  <p class="rail-title"><i class="fa-solid fa-link fa-fw rail-title-icon" aria-hidden="true"></i>Related Posts</p>
  <div class="rail-body">
    <ul>
      {{ range $related }}
      <li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
      {{ end }}
    </ul>
  </div>
</nav>
{{- end -}}
