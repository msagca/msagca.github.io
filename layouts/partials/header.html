<header class="site-header" id="site-header">
  <div class="site-header-left">
    <a class="icon-btn" href="{{ "/" | relLangURL }}" title="Home">
      <i class="fa-solid fa-gamepad" aria-hidden="true"></i>
      <span class="visually-hidden">Home</span>
    </a>

    {{ with site.Menus.social }}
    <div class="row-scroll">
      <button type="button" class="row-scroll-arrow row-scroll-arrow--prev icon-btn" aria-label="Scroll left" hidden><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></button>
      <ul class="social-links row-scroll-track">
        {{ range . }}{{ partial "social-link.html" . }}{{ end }}
      </ul>
      <button type="button" class="row-scroll-arrow row-scroll-arrow--next icon-btn" aria-label="Scroll right" hidden><i class="fa-solid fa-chevron-right" aria-hidden="true"></i></button>
    </div>
    {{ end }}
  </div>

  <div class="site-header-right">
    <div class="scheme-picker" id="scheme-picker">
      <button type="button" class="scheme-name" id="scheme-name" title="Cycle color scheme">Dark</button>
      <button class="icon-btn" id="scheme-mode-toggle" type="button" title="Toggle dark/light mode">
        <svg id="scheme-icon-dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
        <svg id="scheme-icon-light" viewBox="0 0 24 24" aria-hidden="true" style="display:none"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0-5 1.5 3h-3L12 2zm0 20-1.5-3h3L12 22zM2 12l3-1.5v3L2 12zm20 0-3 1.5v-3L22 12zM4.2 4.2l2.9 1 -1.9 1.9-1-2.9zm14.7 15.6-1-2.9 2.9 1-1.9 1.9zM4.2 19.8l1-2.9 1.9 1.9-2.9 1zM19.8 4.2l-2.9 1 1.9 1.9 1-2.9z"/></svg>
        <span class="visually-hidden">Toggle dark/light mode</span>
      </button>
    </div>
  </div>
</header>
