[goldmark.renderer]
unsafe = true
[goldmark.extensions.passthrough]
enable = true
[goldmark.extensions.passthrough.delimiters]
block = [['\[', '\]'], ['$$', '$$']]
inline = [['\(', '\)'], ['$', '$']]
[tableOfContents]
endLevel = 4
ordered = false
startLevel = 2
[highlight]
noClasses = false
codeFences = true
guessSyntax = true
lineNos = false
tabWidth = 4
